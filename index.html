<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heyday Lawns – Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --dark: #1a1a14;
    --green: #2d5a27;
    --gold: #c8a84b;
    --light-green: #4a7c3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── APP SHELL ── */
  .app { display: flex; gap: 0; min-height: 100vh; }

  /* ── SIDEBAR / FORM ── */
  .sidebar {
    width: 420px; min-width: 420px;
    background: #111109;
    border-right: 1px solid #2a2a1e;
    padding: 32px 28px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 24px;
  }
  .sidebar-header { display: flex; align-items: center; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid #2a2a1e; }
  .sidebar-header img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .sidebar-header h1 { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--cream); line-height: 1.2; }
  .sidebar-header span { font-size: 11px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }

  .form-section { display: flex; flex-direction: column; gap: 10px; }
  .form-section label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; font-family: 'DM Mono', monospace; }
  .form-section input, .form-section textarea, .form-section select {
    background: #1c1c12;
    border: 1px solid #2a2a1e;
    border-radius: 6px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    width: 100%;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-section input:focus, .form-section textarea:focus {
    border-color: var(--gold);
  }
  .form-section textarea { resize: vertical; min-height: 70px; }

  .section-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold); font-family: 'DM Mono', monospace;
    padding: 6px 0; border-bottom: 1px solid #2a2a1e;
  }

  /* Line items */
  .line-item-row {
    display: grid;
    grid-template-columns: 1fr 80px 90px 28px;
    gap: 6px; align-items: center;
  }
  .line-item-row input {
    background: #1c1c12; border: 1px solid #2a2a1e;
    border-radius: 5px; color: var(--cream);
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    padding: 8px 9px; outline: none; width: 100%;
  }
  .line-item-row input:focus { border-color: var(--gold); }
  .line-item-row input.qty-parsed { border-color: var(--light-green); background: #1c2618; }
  .remove-btn {
    background: none; border: none; color: #555; cursor: pointer; font-size: 16px;
    width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .remove-btn:hover { background: #2a1414; color: #e05555; }
  .add-item-btn {
    background: none; border: 1px dashed #2a2a1e; border-radius: 6px;
    color: #888; font-size: 12px; padding: 8px; cursor: pointer; width: 100%;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  }
  .add-item-btn:hover { border-color: var(--gold); color: var(--gold); }

  .col-headers {
    display: grid; grid-template-columns: 1fr 80px 90px 28px;
    gap: 6px;
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
    color: #555; font-family: 'DM Mono', monospace; padding: 0 0 2px 0;
  }

  .generate-btn {
    background: var(--green); border: none; border-radius: 8px;
    color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    padding: 14px; cursor: pointer; width: 100%; letter-spacing: 0.5px;
    transition: all 0.2s; margin-top: 8px;
  }
  .generate-btn:hover { background: var(--light-green); transform: translateY(-1px); }

  /* ── PREVIEW AREA ── */
  .preview-area {
    flex: 1;
    background: #0d0d08;
    padding: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    overflow-y: auto;
  }
  .preview-actions {
    display: flex; gap: 10px; align-items: center;
    width: 100%; max-width: 680px;
  }
  .preview-actions span {
    font-size: 11px; color: #555; font-family: 'DM Mono', monospace; flex: 1;
  }
  .print-btn {
    background: var(--gold); border: none; border-radius: 6px;
    color: var(--dark); font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 12px; padding: 9px 18px; cursor: pointer; letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .print-btn:hover { background: #d4b45a; }

  /* ── INVOICE DOCUMENT ── */
  .invoice-doc {
    width: 680px;
    background: #fff;
    color: #1a1a14;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    font-family: 'DM Sans', sans-serif;
  }

  .inv-header {
    background: var(--dark);
    padding: 18px 32px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .inv-header-left img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; }
  .inv-header-right { text-align: right; }
  .inv-header-right .inv-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px; color: var(--cream); letter-spacing: 2px;
    text-transform: uppercase;
  }
  .inv-header-right .inv-number {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--gold); margin-top: 4px; letter-spacing: 1px;
  }
  .inv-header-right .inv-date {
    font-size: 11px; color: #888; margin-top: 2px; font-family: 'DM Mono', monospace;
  }

  .inv-body { padding: 20px 32px; }

  .inv-addresses {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 18px;
  }
  .inv-addr-block .addr-label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: #999; margin-bottom: 6px; font-family: 'DM Mono', monospace;
  }
  .inv-addr-block .addr-name { font-weight: 600; font-size: 14px; color: #1a1a14; }
  .inv-addr-block .addr-detail { font-size: 12px; color: #555; line-height: 1.6; margin-top: 2px; white-space: pre-line; }

  .inv-divider { border: none; border-top: 1px solid #e8e3d8; margin: 0 0 28px; }

  /* Table */
  .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  .inv-table thead tr { border-bottom: 2px solid var(--dark); }
  .inv-table thead th {
    font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #999; font-family: 'DM Mono', monospace;
    padding: 0 0 7px; text-align: left;
  }
  .inv-table thead th:last-child { text-align: right; }
  .inv-table tbody tr { border-bottom: 1px solid #f0ece3; }
  .inv-table tbody td { padding: 7px 0; font-size: 13px; color: #2a2a14; vertical-align: top; }
  .inv-table tbody td:nth-child(2),
  .inv-table tbody td:nth-child(3) { color: #777; }
  .inv-table tbody td:last-child { text-align: right; font-weight: 500; }
  .inv-table tbody td.item-desc { font-weight: 500; }

  /* Totals */
  .inv-totals { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .inv-totals-box { min-width: 220px; }
  .totals-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .totals-row.subtotal { color: #555; border-bottom: 1px solid #e8e3d8; margin-bottom: 6px; padding-bottom: 10px; }
  .totals-row.total {
    font-weight: 700; font-size: 18px; color: var(--dark);
    border-top: 2px solid var(--dark); padding-top: 10px; margin-top: 4px;
  }
  .totals-row span:first-child { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .totals-row.total span:first-child { font-size: 13px; }

  /* Payment */
  .inv-payment {
    background: #f8f5ef;
    border-radius: 8px;
    padding: 14px 20px;
    display: flex; gap: 28px; align-items: flex-start;
  }
  .payment-col { flex: 1; }
  .payment-col h3 {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: #999; margin-bottom: 12px; font-family: 'DM Mono', monospace;
  }
  .payment-option {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 12px; color: #555;
  }
  .payment-option strong { color: var(--dark); }
  .venmo-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .venmo-col img { width: 260px; height: 260px; object-fit: cover; }
  .venmo-col .venmo-label {
    font-size: 10px; color: #999; font-family: 'DM Mono', monospace; letter-spacing: 1px;
  }

  .inv-footer {
    text-align: center; padding: 12px 32px;
    background: var(--dark); color: #555;
    font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px;
  }
  .inv-footer span { color: var(--gold); }

  /* Notes */
  .inv-notes {
    background: #fffdf7; border-left: 3px solid var(--gold);
    padding: 12px 16px; border-radius: 0 6px 6px 0;
    margin-bottom: 16px; font-size: 12px; color: #666; line-height: 1.6;
  }
  .inv-notes strong { color: var(--dark); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 4px; font-family: 'DM Mono', monospace; }

  /* Qty parsed hint */
  .qty-hint { font-size: 10px; color: var(--light-green); margin-top: 3px; }

  @media print {
    body { background: #fff; }
    .sidebar, .preview-actions { display: none !important; }
    .preview-area { background: #fff; padding: 0; }
    .invoice-doc { box-shadow: none; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR FORM -->
  <div class="sidebar">
    <div class="sidebar-header">
      <img id="logo-thumb" src="" alt="Heyday Lawns">
      <div>
        <h1>Heyday Lawns</h1>
        <span>Invoice Generator</span>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Invoice Details</div>
      <label>Invoice #</label>
      <input type="text" id="inv-num" value="HL-001" placeholder="HL-001">
      <label>Date</label>
      <input type="date" id="inv-date">
    </div>

    <div class="form-section">
      <div class="section-title">Client Information</div>
      <label>Client Name</label>
      <input type="text" id="client-name" placeholder="John Smith">
      <label>Client Address</label>
      <textarea id="client-addr" placeholder="123 Main St&#10;Omaha, NE 68001"></textarea>
    </div>

    <div class="form-section">
      <div class="section-title">Line Items</div>
      <div class="col-headers">
        <span>Description</span><span>Qty</span><span>Price ($)</span><span></span>
      </div>
      <div id="line-items"></div>
      <button class="add-item-btn" onclick="addLineItem()">+ Add Item</button>
    </div>

    <div class="form-section">
      <div class="section-title">Notes (optional)</div>
      <textarea id="inv-notes" placeholder="Thank you for your business!"></textarea>
    </div>

    <button class="generate-btn" onclick="generateInvoice()">⚡ Generate Invoice</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-area">
    <div class="preview-actions">
      <span>Invoice Preview</span>
      <button class="print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
    <div class="invoice-doc" id="invoice-doc">
      <!-- rendered here -->
    </div>
  </div>
</div>

// ── WORD → NUMBER ──
const ONES = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENS = {twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};

function wordsToNumber(str) {
  const s = str.trim().toLowerCase().replace(/-/g,' ');
  if (!isNaN(parseFloat(s)) && s !== '') return parseFloat(s);
  const parts = s.split(/\s+/);
  let total = 0, current = 0;
  for (const p of parts) {
    if (ONES[p] !== undefined) current += ONES[p];
    else if (TENS[p] !== undefined) current += TENS[p];
    else if (p === 'hundred') current *= 100;
    else if (p === 'thousand') { total += current * 1000; current = 0; }
    else if (p === 'million') { total += current * 1000000; current = 0; }
    else if (p === 'and') continue;
    else return null;
  }
  total += current;
  return total > 0 ? total : null;
}

// ── LINE ITEMS ──
let items = [];
let itemCount = 0;

function addLineItem(desc='', qty='', price='') {
  const id = ++itemCount;
  items.push({id});
  const row = document.createElement('div');
  row.className = 'line-item-row';
  row.id = `row-${id}`;
  row.innerHTML = `
    <input type="text" placeholder="Service description" value="${desc}"
      oninput="updateItem(${id},'desc',this.value)" id="desc-${id}">
    <input type="text" placeholder="1" value="${qty}"
      oninput="handleQty(${id},this)" id="qty-${id}">
    <input type="text" placeholder="0.00" value="${price}"
      oninput="updateItem(${id},'price',this.value)" id="price-${id}">
    <button class="remove-btn" onclick="removeItem(${id})">×</button>
  `;
  document.getElementById('line-items').appendChild(row);
  updateItem(id,'desc',desc);
  if(qty) handleQty(id, {value: qty});
  updateItem(id,'price',price);
}

function handleQty(id, input) {
  const raw = input.value;
  const parsed = wordsToNumber(raw);
  const el = document.getElementById(`qty-${id}`);
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (parsed !== null && isNaN(parseFloat(raw))) {
    el.classList.add('qty-parsed');
    el.title = `Recognized as: ${parsed}`;
    item.qty = parsed;
  } else {
    el.classList.remove('qty-parsed');
    el.title = '';
    item.qty = parseFloat(raw) || 0;
  }
  item.qtyRaw = raw;
}

function updateItem(id, field, val) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (field==='desc') item.desc = val;
  if (field==='price') item.price = parseFloat(val) || 0;
}

function removeItem(id) {
  items = items.filter(i=>i.id!==id);
  const row = document.getElementById(`row-${id}`);
  if (row) row.remove();
}

// ── SET DATE ──
document.getElementById('inv-date').value = new Date().toISOString().split('T')[0];

// ── AUTO-INCREMENT INVOICE NUMBER (Google Sheet synced) ──
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzTmFCSxoLjAohoqyeb7WxWuPkiPdzCBKYTZcDfiXSalkNa1viqEL6MNTWMxIi3Lsu_0A/exec';

async function loadInvoiceNumber() {
  try {
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    const next = parseInt(data.count) || 1;
    document.getElementById('inv-num').value = 'HL-' + String(next).padStart(3, '0');
  } catch(e) {
    // Fallback to localStorage if offline
    const last = parseInt(localStorage.getItem('hl_invoice_count') || '0');
    document.getElementById('inv-num').value = 'HL-' + String(last + 1).padStart(3, '0');
  }
}
loadInvoiceNumber();

// ── SET LOGO ──

// ── GENERATE ──
function generateInvoice() {
  const invNum  = document.getElementById('inv-num').value || 'HL-001';
  // Save invoice number to Google Sheet so all devices stay in sync
  const numMatch = invNum.match(/(\d+)$/);
  if (numMatch) {
    const currentNum = parseInt(numMatch[1]);
    localStorage.setItem('hl_invoice_count', currentNum);
    fetch(SHEET_URL, {
      method: 'POST',
      body: JSON.stringify({count: currentNum + 1}),
      headers: {'Content-Type': 'application/json'}
    }).catch(() => {}); // silently fail if offline
  }
  const invDate = document.getElementById('inv-date').value;
  const clientName = document.getElementById('client-name').value || 'Valued Client';
  const clientAddr = document.getElementById('client-addr').value || '';
  const notes  = document.getElementById('inv-notes').value;

  // Re-sync qty values from DOM
  items.forEach(item => {
    const qEl = document.getElementById(`qty-${item.id}`);
    const dEl = document.getElementById(`desc-${item.id}`);
    const pEl = document.getElementById(`price-${item.id}`);
    if (qEl) handleQty(item.id, qEl);
    if (dEl) item.desc = dEl.value;
    if (pEl) item.price = parseFloat(pEl.value) || 0;
  });

  const subtotal = items.reduce((s,i) => s + (i.qty||0)*(i.price||0), 0);
  const fmt = n => '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const fmtDate = d => { if(!d) return ''; const [y,m,day]=d.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${months[+m-1]} ${+day}, ${y}`; };

  const tableRows = items.length ? items.map(i => `
    <tr>
      <td class="item-desc">${i.desc||'—'}</td>
      <td>${i.qtyRaw||i.qty||0}</td>
      <td>${fmt(i.price||0)}</td>
      <td>${fmt((i.qty||0)*(i.price||0))}</td>
    </tr>`).join('') :
    `<tr><td colspan="4" style="text-align:center;color:#bbb;padding:20px 0;">No items added</td></tr>`;

  const notesHtml = notes ? `
    <div class="inv-notes">
      <strong>Notes</strong>${notes}
    </div>` : '';

  document.getElementById('invoice-doc').innerHTML = `
    <div class="inv-header">
      <div class="inv-header-left">
        <img src="data:image/png;base64,${LOGO_B64}" alt="Heyday Lawns Logo">
      </div>
      <div class="inv-header-right">
        <div class="inv-title">Invoice</div>
        <div class="inv-number"># ${invNum}</div>
        <div class="inv-date">${fmtDate(invDate)}</div>
      </div>
    </div>

    <div class="inv-body">
      <div class="inv-addresses">
        <div class="inv-addr-block">
          <div class="addr-label">From</div>
          <div class="addr-name">Heyday Lawns</div>
          <div class="addr-detail">Gabe@HeydayLawns.com<br>531-600-8704</div>
        </div>
        <div class="inv-addr-block">
          <div class="addr-label">Bill To</div>
          <div class="addr-name">${clientName}</div>
          <div class="addr-detail">${clientAddr.replace(/\n/g,'<br>')}</div>
        </div>
      </div>

      <hr class="inv-divider">

      <table class="inv-table">
        <thead>
          <tr>
            <th style="width:44%">Description</th>
            <th style="width:14%">Qty</th>
            <th style="width:18%">Unit Price</th>
            <th style="width:24%;text-align:right">Amount</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>

      <div class="inv-totals">
        <div class="inv-totals-box">
          <div class="totals-row subtotal"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          <div class="totals-row total"><span>Total Due</span><span>${fmt(subtotal)}</span></div>
        </div>
      </div>

      ${notesHtml}

      <div class="inv-payment">
        <div class="payment-col">
          <h3>Payment Options</h3>
          <div class="payment-option">
            <span>📱</span>
            <span><strong>Venmo</strong> — Scan QR code or search <strong>@Gabe-Penton</strong></span>
          </div>
          <div class="payment-option" style="margin-top:10px;">
            <span>✉️</span>
            <span><strong>Mail a Check</strong><br>
              <span style="display:block;margin-top:3px;line-height:1.7;color:#777;">
                Payable to: <strong style="color:#2a2a14">Heyday Lawns</strong><br>
                2529 Calhoun St<br>
                Bellevue, NE 68005
              </span>
            </span>
          </div>
        </div>
        <div class="venmo-col">
          <img src="data:image/jpeg;base64,${QR_B64}" alt="Venmo QR Code">
          <div class="venmo-label">Venmo @Gabe-Penton</div>
        </div>
      </div>
    </div>

    <div class="inv-footer">
      Thank you for choosing <span>Heyday Lawns</span> — 531-600-8704
    </div>
  `;
}

// ── INIT ──
addLineItem('Lawn Mowing','1','60.00');
generateInvoice();
